{% load relations %}
{% load i18n %}

{% block relations-menu %}
  <li class="nav-item dropdown">
    <a href="#"
       class="nav-link dropdown-toggle"
       data-bs-toggle="dropdown"
       role="button"
       aria-haspopup="true"
       aria-expanded="false">{% translate "Relations" %}
      <span class="caret" />
    </a>
    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
      <a class="dropdown-item"
         href="{% url "apis_core:generic:list" "relations.relation" %}">{% translate "All relations" %}</a>
      <div class="dropdown-divider"></div>
      <form class="mx-2">
        <input type="text"
               id="relationFilter"
               class="form-control mb-2 form-control-sm"
               placeholder="{% translate "Filter relations..." %}">
      </form>
      <div id="relationList">
        {% get_relationmodels as relationmodels %}
        {% for model in relationmodels %}
          <a class="dropdown-item relation-item"
             href="{{ model.get_listview_url }}">{{ model.name_and_reverse_name }}</a>
        {% endfor %}
      </div>
    </div>
  </li>
{% endblock relations-menu %}
